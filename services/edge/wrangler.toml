"$schema" = "../../node_modules/wrangler/config-schema.json"
name = "game"
main = "src/worker.js"
# Pins runtime behavior. >= 2026-04-07 so the runtime answers WebSocket close frames itself.
compatibility_date = "2026-09-01"

# Copies the client, sim, ai, contracts and three.js into dist/ before every dev and deploy.
# Through npm, which finds the repo root from any directory (wrangler runs builds from different cwds).
[build]
command = "npm run --silent build:edge"
watch_dir = ["../client", "../sim", "../ai", "../../contracts"] # relative to this file

[assets]
directory = "dist"

[[durable_objects.bindings]]
name = "GAME"
class_name = "GameServer"

# The free plan only allows SQLite-backed Durable Objects. Nothing is stored; this only picks the kind.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameServer"]

# Where the game server runs: a best-effort hint, see README "Where it runs". Changing it starts a
# fresh object (objects never move). Measured from Argentina, "sam" changes nothing: no South
# American Cloudflare site hosts Durable Objects, so both with and without it the object is in
# Miami, ~170ms round trip. The hint matters for players in regions that do have hosting sites.
[vars]
LOBBY_REGION = "sam"
